name: DVM elimination proof

on:
  pull_request:
    branches: [proposals]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - name: Install system projection dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y graphviz inkscape imagemagick
          if ! command -v magick >/dev/null && command -v montage >/dev/null; then
            printf '#!/usr/bin/env bash\ncommand=$1\nshift\nexec "$command" "$@"\n' \
              | sudo tee /usr/local/bin/magick >/dev/null
            sudo chmod +x /usr/local/bin/magick
          fi

      - name: Install canonical dependencies
        run: |
          python -m pip install '.[test]'
          npm ci --ignore-scripts --no-audit --no-fund

      - name: Run current canonical gates
        run: |
          python -m unittest discover -s tests -v
          python examples/expression_suite/build_suite.py \
            --out ci-artifacts/current-expression-suite \
            --require-engines

      - name: Run direct mxGraphModel proof
        id: direct
        working-directory: proposal-evidence/dvm-elimination
        shell: bash
        run: |
          mkdir -p ../../ci-artifacts/dvm-elimination/diagnostics
          set +e
          PYTHONPATH=src python -m unittest discover -s tests -v \
            > ../../ci-artifacts/dvm-elimination/diagnostics/unit.log 2>&1
          unit_status=$?
          if test "$unit_status" -eq 0; then
            PYTHONPATH=src python tools/build_proof.py \
              > ../../ci-artifacts/dvm-elimination/diagnostics/build.log 2>&1
            build_status=$?
          else
            build_status=99
          fi
          if test "$unit_status" -eq 0 && test "$build_status" -eq 0; then
            python tools/verify_required_evidence.py --root . \
              > ../../ci-artifacts/dvm-elimination/diagnostics/evidence.log 2>&1
            evidence_status=$?
          else
            evidence_status=99
          fi
          grep -RIlE '\bDVM\b|DiagramViewModel|RenderAst|RenderingIR' src \
            > ../../ci-artifacts/dvm-elimination/diagnostics/forbidden-source.txt
          forbidden_status=$?
          state_count=$(find generated -type f \( -name 'dvm.json' -o -name 'rendering-ir.json' -o -name 'semantic-state.json' \) | wc -l)
          model_count=$(find generated -mindepth 2 -maxdepth 2 -name model.drawio | wc -l)
          {
            echo "unit_status=$unit_status"
            echo "build_status=$build_status"
            echo "evidence_status=$evidence_status"
            echo "forbidden_grep_status=$forbidden_status"
            echo "state_count=$state_count"
            echo "model_count=$model_count"
          } | tee ../../ci-artifacts/dvm-elimination/diagnostics/status.txt
          cat ../../ci-artifacts/dvm-elimination/diagnostics/unit.log
          test -f ../../ci-artifacts/dvm-elimination/diagnostics/build.log && cat ../../ci-artifacts/dvm-elimination/diagnostics/build.log
          test -f ../../ci-artifacts/dvm-elimination/diagnostics/evidence.log && cat ../../ci-artifacts/dvm-elimination/diagnostics/evidence.log
          status=0
          test "$unit_status" -eq 0 || status=1
          test "$build_status" -eq 0 || status=1
          test "$evidence_status" -eq 0 || status=1
          test "$forbidden_status" -eq 1 || status=1
          test "$state_count" -eq 0 || status=1
          test "$model_count" -eq 13 || status=1
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Install Nix
        if: steps.direct.outputs.status == '0'
        uses: DeterminateSystems/determinate-nix-action@v3

      - name: Run Nix package gates
        if: steps.direct.outputs.status == '0'
        id: nix
        shell: bash
        run: |
          set +e
          mkdir -p ci-artifacts/dvm-elimination/diagnostics
          nix flake check --print-build-logs \
            > ci-artifacts/dvm-elimination/diagnostics/nix-check.log 2>&1
          check_status=$?
          nix build .#jsonl-diagram-core --print-build-logs \
            > ci-artifacts/dvm-elimination/diagnostics/nix-build.log 2>&1
          build_status=$?
          cat ci-artifacts/dvm-elimination/diagnostics/nix-check.log
          cat ci-artifacts/dvm-elimination/diagnostics/nix-build.log
          status=0
          test "$check_status" -eq 0 || status=1
          test "$build_status" -eq 0 || status=1
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Collect self-contained proof
        if: always()
        run: |
          if test "${{ steps.direct.outputs.status }}" = '0'; then
            rm -rf ci-artifacts/dvm-elimination-proof
            cp -R proposal-evidence/dvm-elimination ci-artifacts/dvm-elimination-proof
            python ci-artifacts/dvm-elimination-proof/tools/verify_required_evidence.py \
              --root ci-artifacts/dvm-elimination-proof
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dvm-elimination-proof
          path: ci-artifacts
          if-no-files-found: error

      - name: Enforce DVM proof status
        if: always()
        run: |
          test "${{ steps.direct.outputs.status }}" = '0'
          test "${{ steps.nix.outputs.status }}" = '0'

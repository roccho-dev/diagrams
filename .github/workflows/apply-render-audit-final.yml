name: Apply render audit final payload

on:
  pull_request:
    branches: [staging/14-apply-base]
    paths:
      - .github/workflows/apply-render-audit-final.yml
      - .staging/render-audit-nonworkflow.part00a
      - .staging/render-audit-nonworkflow.part00b
      - .staging/render-audit-nonworkflow.part01
      - .staging/render-audit-nonworkflow.part02
  push:
    branches: [staging/14-render-audit-final]
    paths:
      - .github/workflows/apply-render-audit-final.yml
      - .staging/render-audit-nonworkflow.part00a
      - .staging/render-audit-nonworkflow.part00b
      - .staging/render-audit-nonworkflow.part01
      - .staging/render-audit-nonworkflow.part02
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - name: Verify and apply exact payload
        run: |
          set -euo pipefail
          mkdir -p proof
          for part in 00a 00b 01 02; do
            file=".staging/render-audit-nonworkflow.part${part}"
            wc -c "$file" | tee -a proof/parts.bytes
            sha256sum "$file" | tee -a proof/parts.sha256
          done
          test "$(wc -c < .staging/render-audit-nonworkflow.part00a)" -eq 3800
          test "$(wc -c < .staging/render-audit-nonworkflow.part00b)" -eq 3800
          test "$(wc -c < .staging/render-audit-nonworkflow.part01)" -eq 7600
          test "$(wc -c < .staging/render-audit-nonworkflow.part02)" -eq 7584
          test "$(sha256sum .staging/render-audit-nonworkflow.part00a | cut -d' ' -f1)" = b42816b3e63d6f4fb4bfbcc8d65b56da6e4a5d79aef53fbcd7ec21d754bc5aaf
          test "$(sha256sum .staging/render-audit-nonworkflow.part00b | cut -d' ' -f1)" = 426b7f71c9bcd8f4932cfbc45bb19d82212c4bcd30aeddfddf66fc761d34c346
          test "$(sha256sum .staging/render-audit-nonworkflow.part01 | cut -d' ' -f1)" = c8a173cac9c94275879ee00a47d83ab1f1b6f71f50dc029c762fcffe95c4eea7
          test "$(sha256sum .staging/render-audit-nonworkflow.part02 | cut -d' ' -f1)" = 782d0f256a756121beaa4353ccaae38ce3e2f52ae521edf667a372a760e9f253
          cat .staging/render-audit-nonworkflow.part00a \
              .staging/render-audit-nonworkflow.part00b \
              .staging/render-audit-nonworkflow.part01 \
              .staging/render-audit-nonworkflow.part02 \
              > /tmp/render-audit-nonworkflow.tar.gz.b64
          actual_b64_sha="$(sha256sum /tmp/render-audit-nonworkflow.tar.gz.b64 | cut -d' ' -f1)"
          printf '%s  %s\n' "$actual_b64_sha" /tmp/render-audit-nonworkflow.tar.gz.b64 | tee proof/payload-b64.sha256
          wc -c /tmp/render-audit-nonworkflow.tar.gz.b64 | tee proof/payload-b64.bytes
          test "$actual_b64_sha" = 498e64e49d5e0e072a6a7a73b74a78c808128dc53ba4d235844e7311c5a3f243
          base64 -d /tmp/render-audit-nonworkflow.tar.gz.b64 > /tmp/render-audit-nonworkflow.tar.gz
          actual_tar_sha="$(sha256sum /tmp/render-audit-nonworkflow.tar.gz | cut -d' ' -f1)"
          printf '%s  %s\n' "$actual_tar_sha" /tmp/render-audit-nonworkflow.tar.gz | tee proof/payload-tar.sha256
          wc -c /tmp/render-audit-nonworkflow.tar.gz | tee proof/payload-tar.bytes
          test "$actual_tar_sha" = b1d89b50d441b753c2eb6ba353041718d2592ba8a16c3ff547a788d6c472ae1d
          tar -xzf /tmp/render-audit-nonworkflow.tar.gz
          python -m py_compile \
            src/jsonl_diagram_core/render_audit.py \
            tools/probe_render_audit.py \
            tools/prove_render_audit.py
          PYTHONPATH=src python -m unittest tests.unit.test_render_audit -v |& tee proof/unit.log
          git diff -- \
            contracts/render_audit/v1/policy.json \
            contracts/render_audit/v1/runtime-lock.json \
            src/jsonl_diagram_core/render_audit.py \
            tests/fixtures/render_audit/source-contract.json \
            tests/unit/test_render_audit.py \
            tools/probe_render_audit.py \
            tools/prove_render_audit.py > proof/final.patch
      - name: Commit non-workflow implementation only
        id: commit
        run: |
          set -euo pipefail
          git config user.name 'roccho-dev'
          git config user.email '40359643+roccho-dev@users.noreply.github.com'
          git add \
            contracts/render_audit/v1/policy.json \
            contracts/render_audit/v1/runtime-lock.json \
            src/jsonl_diagram_core/render_audit.py \
            tests/fixtures/render_audit/source-contract.json \
            tests/unit/test_render_audit.py \
            tools/probe_render_audit.py \
            tools/prove_render_audit.py
          cat > /tmp/expected-files <<'EOF'
          contracts/render_audit/v1/policy.json
          contracts/render_audit/v1/runtime-lock.json
          src/jsonl_diagram_core/render_audit.py
          tests/fixtures/render_audit/source-contract.json
          tests/unit/test_render_audit.py
          tools/probe_render_audit.py
          tools/prove_render_audit.py
          EOF
          git diff --cached --name-only | sort > /tmp/actual-files
          sort /tmp/expected-files > /tmp/expected-files.sorted
          diff -u /tmp/expected-files.sorted /tmp/actual-files
          git commit -m 'Harden pinned render audit against false Green'
          sha=$(git rev-parse HEAD)
          echo "$sha" | tee proof/APPLIED_COMMIT
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          git push origin HEAD:staging/14-render-audit-final
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: render-audit-final-apply-proof
          path: proof
          if-no-files-found: error

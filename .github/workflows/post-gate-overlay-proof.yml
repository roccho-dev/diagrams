name: Post-gate decision overlay proof

on:
  pull_request:
    branches: [proposals]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Load exact merged approval lane identities
        id: approval_identity
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          value=json.load(open('contracts/approval_actor/v1/identity.json'))
          assert value['status']=='MERGED_UPSTREAM_IDENTITIES'
          assert value['adrsAcceptedMerge']=='70244fa200d8717c61b514432c54bed4248028d9'
          assert value['admission']=='ALLOW_WITH_ACCEPTED_EXCEPTION'
          assert value['fullCanonicalGreen'] is False
          print('ops_head='+value['opsMergedCommit'])
          print('governance_head='+value['governanceMergedCommit'])
          print('ops_manifest='+value['opsAdapterManifestDigest'])
          print('governance_manifest='+value['governanceEngineManifestDigest'])
          PY
      - uses: actions/checkout@v6
        with:
          repository: roccho-dev/ops
          ref: ${{ steps.approval_identity.outputs.ops_head }}
          path: external/ops
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          repository: roccho-dev/governance
          ref: ${{ steps.approval_identity.outputs.governance_head }}
          path: external/governance
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - name: Install canonical and editor dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            graphviz xvfb libgtk-3-0 libnss3 libasound2t64 libgbm1 libxss1
          npm ci --ignore-scripts --no-audit --no-fund
          python -m pip install '.[test]' playwright
      - name: Pin draw.io Desktop 30.0.4
        run: |
          curl --fail --location --retry 3 \
            https://github.com/jgraph/drawio-desktop/releases/download/v30.0.4/drawio-x86_64-30.0.4.AppImage \
            --output drawio-x86_64-30.0.4.AppImage
          echo '31209df93ed9dd6f3226bdc4f6e413d754431c5d1dd60002f1c03e832c8df54f  drawio-x86_64-30.0.4.AppImage' | sha256sum --check
          chmod +x drawio-x86_64-30.0.4.AppImage
          mkdir -p "$RUNNER_TEMP/drawio-30.0.4"
          (
            cd "$RUNNER_TEMP/drawio-30.0.4"
            "$GITHUB_WORKSPACE/drawio-x86_64-30.0.4.AppImage" --appimage-extract >/dev/null
          )
          test -x "$RUNNER_TEMP/drawio-30.0.4/squashfs-root/drawio"
          echo "DRAWIO_APP=$RUNNER_TEMP/drawio-30.0.4/squashfs-root/drawio" >> "$GITHUB_ENV"
      - name: Run post-gate tests first
        id: post_gate_tests
        shell: bash
        run: |
          mkdir -p ci-artifacts/diagnostics
          set +e
          python -m unittest \
            tests.unit.test_decision_overlay \
            tests.unit.test_approval_actor_contract_identity \
            tests.unit.test_approval_receipt_consumer \
            tests.unit.test_drawio_user_object -v \
            > ci-artifacts/diagnostics/post-gate-tests.log 2>&1
          status=$?
          cat ci-artifacts/diagnostics/post-gate-tests.log
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Run canonical tests
        id: canonical_tests
        shell: bash
        run: |
          set +e
          mv external "$RUNNER_TEMP/approval-lane-external"
          python -m unittest discover -s tests -v > ci-artifacts/diagnostics/canonical-tests.log 2>&1
          status=$?
          mv "$RUNNER_TEMP/approval-lane-external" external
          tail -n 100 ci-artifacts/diagnostics/canonical-tests.log
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Prove exact merged cross-repository approval lane
        id: approval_lane
        shell: bash
        env:
          DIAGRAMS_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          OPS_HEAD: ${{ steps.approval_identity.outputs.ops_head }}
          GOVERNANCE_HEAD: ${{ steps.approval_identity.outputs.governance_head }}
        run: |
          set +e
          python tools/prove_approval_lane_e2e.py \
            --ops-root external/ops \
            --governance-root external/governance \
            --diagrams-root . \
            --ops-head "$OPS_HEAD" \
            --governance-head "$GOVERNANCE_HEAD" \
            --diagrams-head "$DIAGRAMS_HEAD" \
            --out ci-artifacts/approval-lane-e2e.json \
            > ci-artifacts/diagnostics/approval-lane-e2e.log 2>&1
          status=$?
          cat ci-artifacts/diagnostics/approval-lane-e2e.log
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Materialize accepted-risk example
        if: steps.post_gate_tests.outputs.status == '0'
        run: |
          jsonl-diagram-core materialize-review \
            examples/post_gate_overlay/semantic.drawio \
            --policy examples/post_gate_overlay/policy.json \
            --waivers examples/post_gate_overlay/waivers.jsonl \
            --approval-receipts examples/post_gate_overlay/approval-receipts.jsonl \
            --repository roccho-dev/diagrams \
            --candidate-revision aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa \
            --as-of 2026-07-26T12:00:00+09:00 \
            --out-dir ci-artifacts/post-gate-overlay
          test "$(python -c 'import json; print(json.load(open("ci-artifacts/post-gate-overlay/diagram.gate.json"))["risk"])')" = ACCEPTED
          test "$(python -c 'import json; print(json.load(open("ci-artifacts/post-gate-overlay/diagram.projection-receipt.json"))["overlayCount"])')" -gt 0
          grep -q 'approvalReceiptRef="approval:example-001"' ci-artifacts/post-gate-overlay/diagram.review.drawio
          grep -q 'approvalReceiptDigest="sha256:e4d69670766d01e13768e1522143344993d12f43199ec28c36e5fb5d0c169c23"' ci-artifacts/post-gate-overlay/diagram.review.drawio
      - name: Rebuild deterministically
        if: steps.post_gate_tests.outputs.status == '0'
        run: |
          jsonl-diagram-core materialize-review \
            examples/post_gate_overlay/semantic.drawio \
            --policy examples/post_gate_overlay/policy.json \
            --waivers examples/post_gate_overlay/waivers.jsonl \
            --approval-receipts examples/post_gate_overlay/approval-receipts.jsonl \
            --repository roccho-dev/diagrams \
            --candidate-revision aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa \
            --as-of 2026-07-26T12:00:00+09:00 \
            --out-dir ci-artifacts/replay
          diff -ru ci-artifacts/post-gate-overlay ci-artifacts/replay
      - name: Prove fixed draw.io UI edit-save persistence
        if: steps.post_gate_tests.outputs.status == '0'
        run: |
          xvfb-run -a python tools/prove_drawio_editor_persistence.py \
            --drawio-app "$DRAWIO_APP" \
            --semantic ci-artifacts/post-gate-overlay/diagram.semantic.drawio \
            --review ci-artifacts/post-gate-overlay/diagram.review.drawio \
            --out ci-artifacts/editor-persistence
          test -f ci-artifacts/editor-persistence/PASS
          test "$(python -c 'import json; print(json.load(open("ci-artifacts/editor-persistence/editor-persistence-report.json"))["status"])')" = PASS
          grep -q 'approvalReceiptRef="approval:example-001"' ci-artifacts/editor-persistence/review-editor-proof.drawio
          grep -q 'approvalReceiptDigest="sha256:e4d69670766d01e13768e1522143344993d12f43199ec28c36e5fb5d0c169c23"' ci-artifacts/editor-persistence/review-editor-proof.drawio
      - name: Reject competing state, provider logic and dual approval paths
        run: |
          test "$(grep -RIlE 'overlay-state\.json|review-state\.json|decision-current-state\.json' src tests examples docs 2>/dev/null | wc -l)" -eq 0
          test "$(grep -RIlE 'meaning_model|render_ast|drawio_render_ast|RenderingIR' src/jsonl_diagram_core/policy_gate.py src/jsonl_diagram_core/decision_overlay.py src/jsonl_diagram_core/approval_receipt.py src/jsonl_diagram_core/receipt_overlay.py | wc -l)" -eq 0
          python - <<'PY'
          import ast,json
          from pathlib import Path
          root = Path('src/jsonl_diagram_core')
          consumer = (root / 'approval_receipt.py').read_text() + (root / 'policy_gate.py').read_text() + (root / 'receipt_overlay.py').read_text()
          tree = ast.parse(consumer)
          forbidden = {'requests', 'httpx', 'github', 'urllib'}
          for node in ast.walk(tree):
              if isinstance(node, ast.Import):
                  assert not ({a.name.split('.')[0] for a in node.names} & forbidden)
              if isinstance(node, ast.ImportFrom) and node.module:
                  assert node.module.split('.')[0] not in forbidden
          from jsonl_diagram_core import policy_gate
          from jsonl_diagram_core.approval_receipt import ACCEPTED_ENGINE_MANIFEST_DIGEST
          assert 'approvalRef' not in policy_gate._WAIVER_KEYS
          assert 'approvalReceiptRef' in policy_gate._WAIVER_KEYS
          assert 'approvalReceiptDigest' in policy_gate._WAIVER_KEYS
          identity = json.load(open('contracts/approval_actor/v1/identity.json'))
          assert identity['status'] == 'MERGED_UPSTREAM_IDENTITIES'
          assert identity['opsMergedCommit'] == '${{ steps.approval_identity.outputs.ops_head }}'
          assert identity['governanceMergedCommit'] == '${{ steps.approval_identity.outputs.governance_head }}'
          assert identity['governanceEngineManifestDigest'] == ACCEPTED_ENGINE_MANIFEST_DIGEST
          assert identity['opsAdapterManifestDigest'] == '${{ steps.approval_identity.outputs.ops_manifest }}'
          assert identity['governanceEngineManifestDigest'] == '${{ steps.approval_identity.outputs.governance_manifest }}'
          assert identity['admission'] == 'ALLOW_WITH_ACCEPTED_EXCEPTION'
          assert identity['fullCanonicalGreen'] is False
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: post-gate-overlay-proof
          path: ci-artifacts
          if-no-files-found: error
      - name: Enforce tests
        if: always()
        run: |
          test "${{ steps.post_gate_tests.outputs.status }}" = '0'
          test "${{ steps.canonical_tests.outputs.status }}" = '0'
          test "${{ steps.approval_lane.outputs.status }}" = '0'
          test "$(python -c 'import json; print(json.load(open("ci-artifacts/approval-lane-e2e.json"))["status"])')" = PASS

  nix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: cachix/install-nix-action@v31.10.6
      - name: Run Nix gates with retained diagnostics
        id: nix_gates
        shell: bash
        run: |
          mkdir -p ci-artifacts/nix
          set +e
          nix flake check -L 2>&1 | tee ci-artifacts/nix/flake-check.log
          flake_status=${PIPESTATUS[0]}
          build_status=99
          if [ "$flake_status" -eq 0 ]; then
            nix build -L .#jsonl-diagram-core 2>&1 | tee ci-artifacts/nix/build.log
            build_status=${PIPESTATUS[0]}
          else
            printf 'SKIPPED: flake check failed\n' > ci-artifacts/nix/build.log
          fi
          printf '{"flakeStatus":%s,"buildStatus":%s}\n' "$flake_status" "$build_status" > ci-artifacts/nix/status.json
          echo "flake_status=$flake_status" >> "$GITHUB_OUTPUT"
          echo "build_status=$build_status" >> "$GITHUB_OUTPUT"
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: post-gate-overlay-nix-proof
          path: ci-artifacts/nix
          if-no-files-found: error
      - name: Enforce Nix gates
        if: always()
        run: |
          test "${{ steps.nix_gates.outputs.flake_status }}" = '0'
          test "${{ steps.nix_gates.outputs.build_status }}" = '0'
